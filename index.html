<!doctype html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NJ Auto GenPost</title><link rel="stylesheet" href="./css/style.css"></head><body>
<div id="authView" class="auth"><div class="card"><h1>NJ <span>Auto GenPost</span></h1><p>AI Content & Social Automation</p><div><button id="loginTab">เข้าสู่ระบบ</button><button id="registerTab">สมัครสมาชิก</button></div><form id="authForm"><input id="email" type="email" placeholder="อีเมล" required><input id="password" type="password" placeholder="รหัสผ่าน" required minlength="6"><button type="submit" id="authSubmit">เข้าสู่ระบบ</button></form><div id="authMsg"></div></div></div>
<div id="appView" class="hidden"><aside><h2>NJ Auto GenPost</h2><nav>Dashboard</nav><nav>สินค้า</nav><nav>AI Product Finder</nav><nav>Content</nav><nav>Schedule</nav><nav>บัญชี Social</nav><nav>Analytics</nav><button id="logoutBtn">ออกจากระบบ</button></aside><main><header><div><h1>Dashboard</h1><p>Firebase Online</p></div></header><section class="stats"><div>สินค้า <b id="productCount">0</b></div><div>Content <b>0</b></div><div>Scheduled <b>0</b></div><div>Post History <b>0</b></div></section><section class="grid"><div class="panel"><h2>เพิ่มสินค้า</h2><form id="productForm"><input id="productName" placeholder="ชื่อสินค้า" required><input id="productPrice" type="number" placeholder="ราคา"><input id="productUrl" type="url" placeholder="ลิงก์สินค้า"><button type="submit">บันทึกสินค้า</button></form><p id="productMsg"></p></div><div class="panel"><h2>Product Center</h2><div id="productList">ยังไม่มีสินค้า</div></div></section></main></div><script type="module" src="./js/app.js"></script></body></html>
